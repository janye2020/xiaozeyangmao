<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>闪购品牌日 单单有福利</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        background: #f7f7f7;
        color: #222;
      }
      .page-wrap {
        position: relative;
        min-height: 100vh;
        width: 100%;
        max-width: 430px;
        margin: 0 auto;
        background: #ffffff;
        overflow-x: hidden;
        padding-bottom: 42px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 上红下白背景中的红色顶部区域 */
      .hero-bg {
        position: relative;
        width: 100%;
        background: linear-gradient(180deg, #ff1722 0%, #ff2b24 100%);
        padding: 0 16px 88px;
        text-align: center;
        overflow: hidden;
      }
      /* 顶部装饰图形 */
      .decor-purple {
        position: absolute;
        top: -16px;
        left: -12px;
        width: 72px;
        height: 54px;
        background: #9a5cff;
        border-radius: 18px;
        transform: rotate(-16deg);
      }
      .decor-pink-top {
        position: absolute;
        top: -18px;
        right: -10px;
        width: 78px;
        height: 60px;
        background: #ff5ca8;
        border-radius: 50%;
      }
      .decor-green-top {
        position: absolute;
        top: 10px;
        right: 42px;
        width: 34px;
        height: 22px;
        background: #00c46a;
        border-radius: 0 0 20px 20px;
        transform: rotate(-14deg);
      }
      .decor-squiggle {
        position: absolute;
        top: 52px;
        left: -6px;
        width: 54px;
        height: 54px;
        pointer-events: none;
      }
      .decor-dot {
        position: absolute;
        top: 50px;
        right: 22px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ffd426;
      }
      .decor-gift-left {
        position: absolute;
        bottom: 18px;
        left: -16px;
        width: 56px;
        height: 56px;
        background: #ff3b6b;
        border-radius: 10px;
        transform: rotate(-18deg);
      }
      .decor-gift-left::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 6px;
        transform: translateX(-50%);
        background: #ffe066;
      }
      .decor-gift-left::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 6px;
        transform: translateY(-50%);
        background: #ffe066;
      }
      .decor-gift-right {
        position: absolute;
        bottom: 36px;
        right: -18px;
        width: 64px;
        height: 64px;
        background: #ff4757;
        border-radius: 10px;
        transform: rotate(20deg);
        opacity: 0.92;
      }
      .decor-gift-right::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 7px;
        transform: translateX(-50%);
        background: rgba(255, 224, 102, 0.85);
      }
      .decor-gift-right::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 7px;
        transform: translateY(-50%);
        background: rgba(255, 224, 102, 0.85);
      }

      /* 顶部居中白色角标 */
      .top-badge {
        position: relative;
        z-index: 2;
        display: inline-block;
        background: #ffffff;
        color: #ff5500;
        font-size: 20px;
        font-weight: 900;
        font-style: italic;
        padding: 5px 28px 8px;
        border-radius: 0 0 18px 18px;
        box-shadow: 0 4px 12px rgba(150, 0, 10, 0.14);
        margin-bottom: 20px;
        letter-spacing: 1px;
      }

      /* 两行大标题 */
      .hero-title {
        position: relative;
        z-index: 2;
        margin: 0;
        color: #ffffff;
        font-size: 38px;
        font-weight: 900;
        line-height: 1.18;
        letter-spacing: 2px;
        text-shadow: 0 3px 10px rgba(170, 0, 10, 0.25);
      }

      /* 骑跨红白边界的米白主卡片 */
      .main-card {
        position: relative;
        z-index: 3;
        width: calc(100% - 28px);
        margin-top: -66px;
        background: #fff7f4;
        border-radius: 16px;
        padding: 16px 14px 18px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
      }
      .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 12px 5px 6px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(255, 198, 198, 0.56) 0%, rgba(255, 226, 226, 0.2) 72%, rgba(255, 255, 255, 0) 100%);
        margin-bottom: 16px;
      }
      .header-orb {
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffecec, #ff9999);
        box-shadow: 0 2px 6px rgba(255, 107, 107, 0.22);
      }
      .card-title {
        margin: 0;
        font-size: 16px;
        font-weight: 800;
        color: #ef3b32;
      }

      /* 步骤 1 & 2 */
      .steps {
        position: relative;
        padding-left: 2px;
        margin-bottom: 16px;
      }
      .step-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
        line-height: 1.4;
        color: #262626;
        font-weight: 500;
      }
      .step-row + .step-row {
        margin-top: 15px;
      }
      .step-row:first-child::after {
        content: "";
        position: absolute;
        left: 9.5px;
        top: 22px;
        height: 14px;
        border-left: 1.5px dashed #8c8c8c;
      }
      .step-num {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #141414;
        color: #ffffff;
        font-size: 12px;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .hl-red {
        color: #ef3b32;
        font-weight: 700;
      }
      .tb-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: linear-gradient(135deg, #ff7a00, #ff4500);
        color: #ffffff;
        font-size: 13px;
        font-weight: 800;
        margin: 0 3px 0 1px;
      }

      /* 仿真外卖红包弹窗预览区 */
      .preview-stage {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #4e4b48;
        padding: 18px 16px 0;
      }
      .backdrop-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        padding: 12px;
        opacity: 0.22;
        color: #ffffff;
        font-size: 12px;
        text-align: center;
        pointer-events: none;
      }
      .backdrop-item {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 10px;
        padding: 16px 4px;
      }
      .popup-mock {
        position: relative;
        background: linear-gradient(180deg, #fff5f2 0%, #ffffff 34%);
        border-radius: 14px 14px 0 0;
        padding: 18px 12px 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      .ribbon-tag {
        position: absolute;
        top: -2px;
        right: 14px;
        background: linear-gradient(180deg, #ef1a2d, #cf0f22);
        color: #ffffff;
        font-size: 12px;
        font-weight: 800;
        padding: 4px 12px;
        border-radius: 0 0 8px 8px;
        box-shadow: 0 3px 8px rgba(207, 15, 34, 0.3);
      }
      .popup-title {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 900;
        color: #1f1f1f;
        letter-spacing: 0.5px;
      }
      .popup-title .red {
        color: #ff2424;
      }
      .popup-title .spark {
        font-size: 13px;
        vertical-align: 4px;
        margin: 0 2px;
      }
      .voucher-card {
        display: flex;
        align-items: stretch;
        border: 1.5px solid #ff2828;
        border-radius: 10px;
        overflow: hidden;
        background: #ffffff;
        margin-bottom: 10px;
        min-height: 68px;
      }
      .voucher-card:last-child {
        margin-bottom: 0;
      }
      .voucher-left {
        width: 33%;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 8px 4px;
        color: #ff2424;
      }
      .voucher-amount {
        font-size: 24px;
        font-weight: 900;
        line-height: 1.05;
      }
      .voucher-amount small {
        font-size: 14px;
        font-weight: 800;
      }
      .voucher-cond {
        font-size: 10px;
        margin-top: 3px;
        color: #ff3a3a;
      }
      .voucher-right {
        flex: 1;
        background: repeating-linear-gradient(
          -45deg,
          #ff2929,
          #ff2929 10px,
          #f61c1c 10px,
          #f61c1c 20px
        );
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 10px 10px 12px;
        text-align: left;
      }
      .voucher-name {
        font-size: 15px;
        font-weight: 800;
        line-height: 1.2;
      }
      .voucher-limit {
        font-size: 10px;
        opacity: 0.92;
        margin-top: 4px;
      }
      .voucher-pill {
        flex-shrink: 0;
        background: #ffffff;
        color: #ff2424;
        font-size: 11px;
        font-weight: 800;
        padding: 5px 12px;
        border-radius: 999px;
      }

      /* 底部单一主按钮 */
      .cta-wrap {
        width: 100%;
        padding: 28px 20px 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .btn-cta {
        width: 78%;
        max-width: 310px;
        height: 52px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(135deg, #fb251b 0%, #ff6a00 100%);
        color: #ffffff;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(255, 68, 22, 0.32);
        transition: transform 0.12s ease;
      }
      .btn-cta:active {
        transform: scale(0.98);
      }
      .btn-cta.copied {
        background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
        box-shadow: 0 8px 20px rgba(22, 163, 74, 0.28);
      }

      /* 仅当自动复制受阻时才显示的兜底复制框 */
      .fallback-box {
        display: none;
        width: 86%;
        max-width: 320px;
        margin-top: 14px;
        padding: 10px 12px;
        border-radius: 10px;
        background: #fff5f2;
        border: 1px dashed #ff8c66;
        text-align: center;
      }
      .fallback-box textarea {
        width: 100%;
        border: none;
        background: transparent;
        text-align: center;
        font-size: 14px;
        font-weight: 700;
        color: #222;
        resize: none;
        outline: none;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 32px;
        transform: translateX(-50%) translateY(20px);
        background: rgba(17, 17, 17, 0.88);
        color: #ffffff;
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: all 0.2s ease;
        white-space: nowrap;
        z-index: 999;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <header class="hero-bg">
        <div class="decor-purple" aria-hidden="true"></div>
        <div class="decor-pink-top" aria-hidden="true"></div>
        <div class="decor-green-top" aria-hidden="true"></div>
        <svg class="decor-squiggle" viewBox="0 0 60 60" aria-hidden="true">
          <path d="M8,10 Q24,4 20,20 T34,34 T18,50" fill="none" stroke="#ffd21f" stroke-width="8" stroke-linecap="round" />
        </svg>
        <div class="decor-dot" aria-hidden="true"></div>
        <div class="decor-gift-left" aria-hidden="true"></div>
        <div class="decor-gift-right" aria-hidden="true"></div>

        <div class="top-badge" id="badgeText">淘宝闪购</div>
        <h1 class="hero-title">闪购品牌日<br />单单有福利</h1>
      </header>

      <main class="main-card">
        <div class="card-header">
          <span class="header-orb" aria-hidden="true"></span>
          <h2 class="card-title" id="titleText">最高15-15 红包天天领</h2>
        </div>

        <div class="steps">
          <div class="step-row">
            <span class="step-num">1</span>
            <span>第一步：点击下方按钮<span class="hl-red">复制淘口令</span></span>
          </div>
          <div class="step-row">
            <span class="step-num">2</span>
            <span>第二步：<span class="tb-icon">淘</span><span class="hl-red">打开淘宝</span>，领取红包</span>
          </div>
        </div>

        <div class="preview-stage" aria-hidden="true">
          <div class="backdrop-grid">
            <div class="backdrop-item">美食</div>
            <div class="backdrop-item">鲜花</div>
            <div class="backdrop-item">超市</div>
            <div class="backdrop-item">百货</div>
            <div class="backdrop-item">手机</div>
            <div class="backdrop-item">饮品</div>
            <div class="backdrop-item">果蔬</div>
            <div class="backdrop-item">调味</div>
          </div>

          <div class="popup-mock">
            <div class="ribbon-tag">省钱卡</div>
            <div class="popup-title">
              <span class="red">外卖红包<span class="spark">✦</span></span>今日已发放<span class="spark">✦</span>
            </div>

            <div class="voucher-card">
              <div class="voucher-left">
                <div class="voucher-amount"><small>¥</small>15</div>
                <div class="voucher-cond">满15元可用</div>
              </div>
              <div class="voucher-right">
                <div>
                  <div class="voucher-name">外卖红包</div>
                  <div class="voucher-limit">仅限于美食外卖</div>
                </div>
                <span class="voucher-pill">去使用</span>
              </div>
            </div>

            <div class="voucher-card">
              <div class="voucher-left">
                <div class="voucher-amount"><small>¥</small>7</div>
                <div class="voucher-cond">满9元可用</div>
              </div>
              <div class="voucher-right">
                <div>
                  <div class="voucher-name">外卖红包</div>
                  <div class="voucher-limit">仅限于美食外卖</div>
                </div>
                <span class="voucher-pill">去使用</span>
              </div>
            </div>
          </div>
        </div>
      </main>

      <div class="cta-wrap">
        <button class="btn-cta" id="copyBtn" type="button">复制口令打开淘宝领红包</button>
        <div class="fallback-box" id="fallbackBox">
          <div style="font-size:12px;color:#ef3b32;margin-bottom:4px;">请长按下方口令手动复制</div>
          <textarea id="tklInput" rows="2" readonly></textarea>
        </div>
      </div>
    </div>

    <div class="toast" id="toast">已复制口令，请打开手机淘宝领取</div>

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var titleEl = document.getElementById("titleText");
        var badgeEl = document.getElementById("badgeText");
        var copyBtn = document.getElementById("copyBtn");
        var fallbackBox = document.getElementById("fallbackBox");
        var tklInput = document.getElementById("tklInput");
        var toastEl = document.getElementById("toast");
        var currentTkl = "";

        function decodeBase64Utf8(str) {
          try {
            var bin = atob(str.replace(/-/g, "+").replace(/_/g, "/"));
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) {
              bytes[i] = bin.charCodeAt(i);
            }
            return new TextDecoder("utf-8").decode(bytes);
          } catch (e) {
            return "";
          }
        }

        function showToast(msg) {
          toastEl.textContent = msg;
          toastEl.classList.add("show");
          clearTimeout(window.__toastTimer);
          window.__toastTimer = setTimeout(function () {
            toastEl.classList.remove("show");
          }, 2400);
        }

        function applyData(data) {
          var title = data.title || "最高15-15 红包天天领";
          var badge = data.badge || "淘宝闪购";
          var tkl = (data.tkl || "").trim();

          titleEl.textContent = title;
          badgeEl.textContent = badge;
          if (!tkl) {
            copyBtn.disabled = true;
            copyBtn.style.opacity = "0.5";
            copyBtn.textContent = "口令无效或已过期";
            return;
          }
          currentTkl = tkl;
          tklInput.value = tkl;
        }

        function fallbackCopy(text) {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.top = "0";
          ta.style.left = "-9999px";
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, text.length);
          var ok = false;
          try {
            ok = document.execCommand("copy");
          } catch (e) {
            ok = false;
          }
          document.body.removeChild(ta);
          return ok;
        }

        function copyTkl() {
          if (!currentTkl) return;
          var done = function () {
            copyBtn.textContent = "已复制口令，请打开淘宝领红包";
            copyBtn.classList.add("copied");
            showToast("已复制口令，切回桌面打开手机淘宝即可");
          };
          var fail = function () {
            fallbackBox.style.display = "block";
            tklInput.focus();
            tklInput.select();
            showToast("请长按下方口令手动复制");
          };
          if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(currentTkl).then(done).catch(function () {
              if (fallbackCopy(currentTkl)) done();
              else fail();
            });
          } else if (fallbackCopy(currentTkl)) {
            done();
          } else {
            fail();
          }
        }

        copyBtn.addEventListener("click", copyTkl);

        var dParam = params.get("d");
        if (dParam) {
          var raw = decodeBase64Utf8(dParam);
          try {
            applyData(JSON.parse(raw));
            return;
          } catch (e) {}
        }

        var tklParam = params.get("tkl");
        if (tklParam) {
          applyData({
            tkl: tklParam,
            title: params.get("title") || "最高15-15 红包天天领",
            badge: params.get("badge") || "淘宝闪购"
          });
          return;
        }

        var codeParam = params.get("code");
        if (codeParam) {
          fetch("/assets/tb-links.json?v=" + Date.now())
            .then(function (r) { return r.json(); })
            .then(function (map) {
              if (map && map[codeParam]) {
                applyData(map[codeParam]);
              } else {
                applyData({ title: "口令已失效或不存在", tkl: "" });
              }
            })
            .catch(function () {
              applyData({ title: "加载失败，请稍后重试", tkl: "" });
            });
          return;
        }

        applyData({ title: "缺少口令参数", tkl: "" });
      })();
    </script>
  </body>
</html>
