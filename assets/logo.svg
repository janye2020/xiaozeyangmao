<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ozGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff1e0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff5500" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#ozGrad)" filter="url(#shadow)"/>
  
  <!-- Cute Stylized Sheep Body / Cloud Shape -->
  <g fill="url(#badgeGrad)">
    <circle cx="60" cy="56" r="28"/>
    <circle cx="42" cy="52" r="18"/>
    <circle cx="78" cy="52" r="18"/>
    <circle cx="36" cy="68" r="14"/>
    <circle cx="84" cy="68" r="14"/>
    <circle cx="50" cy="74" r="16"/>
    <circle cx="70" cy="74" r="16"/>
  </g>
  
  <!-- Sheep Ears -->
  <ellipse cx="34" cy="54" rx="7" ry="12" fill="#ff7700" transform="rotate(-25 34 54)"/>
  <ellipse cx="86" cy="54" rx="7" ry="12" fill="#ff7700" transform="rotate(25 86 54)"/>

  <!-- Face -->
  <circle cx="60" cy="60" r="18" fill="#ffe3cf"/>
  
  <!-- Eyes -->
  <ellipse cx="53" cy="58" rx="2.2" ry="3.2" fill="#333"/>
  <ellipse cx="67" cy="58" rx="2.2" ry="3.2" fill="#333"/>
  <!-- Eye highlights -->
  <circle cx="54" cy="57" r="1" fill="#fff"/>
  <circle cx="68" cy="57" r="1" fill="#fff"/>

  <!-- Cute Blush -->
  <circle cx="48" cy="63" r="3" fill="#ff8a8a" opacity="0.6"/>
  <circle cx="72" cy="63" r="3" fill="#ff8a8a" opacity="0.6"/>

  <!-- Nose & Smile -->
  <path d="M 58 64 Q 60 66 62 64" stroke="#ff6600" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Little Golden Coin / Badge -->
  <circle cx="84" cy="34" r="14" fill="#ffd700" stroke="#fff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="84" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#d97706" text-anchor="middle">¥</text>
</svg>
